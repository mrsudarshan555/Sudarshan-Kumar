name: Build Mayra Capacitor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. सारी डिपेंडेंसी और Tailwind का लिनक्स बाइनरी इंस्टॉल करो
      - name: Install Dependencies & Tailwind Native Binding
        run: |
          npm install --include=optional
          npm install -D @tailwindcss/oxide-linux-x64-gnu
          npm install -D @capacitor/core @capacitor/cli @capacitor/android

      # 2. असली Web UI (HTML/React) बिल्ड करो (बिना सर्वर के)
      - name: Build Web App
        run: npx vite build

      # 3. Capacitor Android जोड़ो और Web UI को सिंक करो
      - name: Add and Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 4. APK कंपाइल करो
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 5. तैयार Web UI वाली APK को डाउनलोड के लिए उपलब्ध कराओ
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mayra-Web-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
