name: Build Mayra Capacitor Web APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Mayra Web UI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      # 1. Install Node Dependencies & Native Tailwind Linux Binding (with legacy-peer-deps)
      - name: Install Dependencies & Tailwind Native Binding
        run: |
          npm install --legacy-peer-deps --include=optional
          npm install -D --legacy-peer-deps @tailwindcss/oxide-linux-x64-gnu

      # 2. Build Web UI (HTML, CSS, React, 3D Assets, JS bundle)
      - name: Build Web App (Vite)
        run: npx vite build

      # 3. Add & Sync Web UI into Capacitor Android
      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 4. Compile Capacitor Android APK
      - name: Build Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      # 5. Upload APK Artifact (Direct download from GitHub Actions)
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mayra-Web-UI-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 6. Create GitHub Release
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MAYRA Web APK #${{ github.run_number }}"
          body: |
            ### 🤖 Mayra Web UI Capacitor Android Build
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Trigger**: `${{ github.event_name }}`
            - **File**: `app-debug.apk` (Real Web UI inside Capacitor WebView)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}

